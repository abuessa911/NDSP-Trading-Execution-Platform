name: NEX M1 recovered secret provider isolated QA (no deployment)
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m1-secret-source-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Install existing pinned NEX dependencies
        run: uv sync --frozen --dev
      - name: Validate M1 secret provider and actual FastAPI OpenAPI generation
        env:
          PYTHONPATH: apps/api
          TRADING_MODE: paper
          LIVE_TRADING_ENABLED: 'false'
          GLOBAL_KILL_SWITCH: 'true'
          BINANCE_ALLOW_WITHDRAW: 'false'
        run: |
          set -Eeuo pipefail
          uv run pytest apps/api/tests/test_secrets.py apps/api/tests/test_contract.py apps/api/tests/test_config.py -q
          uv run ruff check apps/api/nex_api/secrets.py
      - name: Do not deploy
        run: |
          printf 'M1_SOURCE_RECOVERY_CHECKED=YES\nBROKER_CONNECTIVITY=DISABLED\nPRODUCTION_DEPLOYED=NO\n'
