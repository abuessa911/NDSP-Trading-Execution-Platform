name: NDSP application boundary (read-only governance)
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  application-boundary:
    name: application-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed PR merge state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check using base-branch governance (not PR-edited guard)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "${BASE_SHA}"
          fi
          git show "${BASE_SHA}:governance/ndsp_scope_gate.py" > "${RUNNER_TEMP}/ndsp-scope-gate.py"
          python3 "${RUNNER_TEMP}/ndsp-scope-gate.py" --selftest
          python3 "${RUNNER_TEMP}/ndsp-scope-gate.py"
