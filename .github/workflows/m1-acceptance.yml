# NDSP-NEX M1 — verification ONLY. Deliberately no release/deploy jobs.
name: NDSP NEX M1 — Hosted Acceptance (Nonproduction)
on:
  pull_request:
    branches: [replit-handoff-20261012]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nex-m1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  api-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check apps/api scripts/ci-m1-compose.py scripts/verify-m1-compose.py scripts/tests
      - run: uv run mypy apps/api/nex_api
      - run: uv run python scripts/export-m1-openapi.py --check
      - run: uv run pytest apps/api/tests scripts/tests
  console:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/ndsp-console run build
        env:
          BASE_PATH: /
          NEXT_TELEMETRY_DISABLED: '1'
      - run: pnpm --filter @workspace/ndsp-console run typecheck
      - run: pnpm --filter @workspace/ndsp-console run test
  postgres-redis:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      M1_PROJECT: nex-m1-isolated-verification-ci${{ github.run_id }}a${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - name: Real isolated database / Redis / API contract checks
        env:
          M1_EVIDENCE: ${{ runner.temp }}/nex-m1-evidence
          M1_CONTEXT: ${{ runner.temp }}/nex-m1-source
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" \
            python scripts/ci-m1-compose.py --project "$M1_PROJECT" \
              --evidence "$M1_EVIDENCE" --context "$M1_CONTEXT"
      - name: Scoped test resource cleanup
        if: always()
        env:
          M1_EVIDENCE: ${{ runner.temp }}/nex-m1-evidence
          M1_CONTEXT: ${{ runner.temp }}/nex-m1-source
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" \
            python scripts/ci-m1-compose.py --finalize --project "$M1_PROJECT" \
              --evidence "$M1_EVIDENCE" --context "$M1_CONTEXT"
  keycloak-mfa:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AUTH_PROJECT: nex-m1-isolated-verification-authci${{ github.run_id }}a${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: astral-sh/setup-uv@v5
      - name: Install isolated test browser
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
        run: uv run --frozen --with playwright==1.63.0 playwright install --with-deps chromium
      - name: Genuine disposable Keycloak browser and administrator MFA
        env:
          AUTH_CONTEXT: ${{ runner.temp }}/nex-auth-source
          AUTH_EVIDENCE: ${{ runner.temp }}/nex-auth-evidence
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" \
            uv run --frozen --with playwright==1.63.0 python scripts/verify-m1-auth.py \
              --project "$AUTH_PROJECT" --context "$AUTH_CONTEXT" --evidence "$AUTH_EVIDENCE"
      - name: Cleanup only this test project
        if: always()
        env:
          AUTH_CONTEXT: ${{ runner.temp }}/nex-auth-source
          AUTH_EVIDENCE: ${{ runner.temp }}/nex-auth-evidence
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" \
            uv run --frozen python scripts/verify-m1-auth.py --finalize \
              --project "$AUTH_PROJECT" --context "$AUTH_CONTEXT" --evidence "$AUTH_EVIDENCE"
