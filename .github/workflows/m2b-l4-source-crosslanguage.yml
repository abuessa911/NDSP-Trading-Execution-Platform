# Test-only, no CD production connector, no deploy, no order permissions.
name: NEX M2-B L4 — Source Issuer Cross-language Acceptance
on:
  pull_request:
    branches: [test/m2b-l3-readonly-production-block-gate-20261014]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-language-l4-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nex_m2b_preview
          POSTGRES_USER: m2b_fixture
          POSTGRES_PASSWORD: synthetic-m2b-admin-only
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U m2b_fixture -d nex_m2b_preview"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - name: Verify isolated signed source versions and immutable tenant ledger
        env:
          M2B_L4_ADMIN_DSN: postgresql://m2b_fixture:synthetic-m2b-admin-only@127.0.0.1:5432/nex_m2b_preview
        run: bash scripts/m2b_l4_source_crosslanguage_acceptance.sh
