name: NDSP and Hunter fullstack verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fullstack-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-browser-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scripts/fullstack-qa
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - if: always()
        run: npm run test:api
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-qa-results
          path: scripts/fullstack-qa/results/
          retention-days: 7
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Entire backend suite with TCP disabled
        run: uv run python scripts/fullstack-qa/offline_backend.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-qa-results
          path: scripts/fullstack-qa/results/backend-offline-all.xml
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      QA_PROJECT: nex-m1-isolated-verification-qa${{ github.run_id }}a${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - name: Reuse existing isolated PostgreSQL Redis API acceptance runner
        run: >-
          env -i PATH="$PATH" HOME="$RUNNER_TEMP"
          python scripts/ci-m1-compose.py --project "$QA_PROJECT"
          --evidence "$RUNNER_TEMP/qa-db-evidence"
          --context "$RUNNER_TEMP/qa-db-source"
      - if: always()
        run: >-
          env -i PATH="$PATH" HOME="$RUNNER_TEMP"
          python scripts/ci-m1-compose.py --finalize --project "$QA_PROJECT"
          --evidence "$RUNNER_TEMP/qa-db-evidence"
          --context "$RUNNER_TEMP/qa-db-source"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-db-verdict
          path: ${{ runner.temp }}/qa-db-evidence/verification-result.json

  telemetry:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      telemetry-db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qa_observer
          POSTGRES_PASSWORD: isolated-qa-only
          POSTGRES_DB: ndsp_qa_telemetry
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U qa_observer -d ndsp_qa_telemetry"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - name: Exercise real SDK HTTP delivery and API to PostgreSQL trace
        env:
          PYTHONPATH: apps/api
          QA_OTEL_DATABASE_URL: postgresql+asyncpg://qa_observer:isolated-qa-only@127.0.0.1:15432/ndsp_qa_telemetry
          QA_TELEMETRY_RESULT: scripts/fullstack-qa/results/telemetry-hosted.json
        run: >-
          uv run --frozen --with-requirements scripts/fullstack-qa/telemetry-requirements.txt
          python scripts/fullstack-qa/telemetry_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-telemetry-verdict
          path: scripts/fullstack-qa/results/telemetry-hosted.json
  browser-auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AUTH_PROJECT: nex-m1-isolated-verification-authqa${{ github.run_id }}a${{ github.run_attempt }}
      AUTH_CONTEXT: ${{ github.workspace }}/../qa-auth-source
      AUTH_EVIDENCE: ${{ github.workspace }}/../qa-auth-evidence
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/../qa-auth-browsers
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: astral-sh/setup-uv@v5
      - run: uv run --frozen --with playwright==1.63.0 playwright install --with-deps chromium
      - name: Existing genuine Keycloak and administrator MFA browser acceptance
        run: >-
          env -i PATH="$PATH" HOME="$RUNNER_TEMP"
          PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH"
          uv run --frozen --with playwright==1.63.0 python scripts/verify-m1-auth.py
          --project "$AUTH_PROJECT" --context "$AUTH_CONTEXT" --evidence "$AUTH_EVIDENCE"
      - if: always()
        run: python scripts/fullstack-qa/auth_summary.py
      - if: always()
        run: >-
          env -i PATH="$PATH" HOME="$RUNNER_TEMP"
          uv run --frozen python scripts/verify-m1-auth.py --finalize
          --project "$AUTH_PROJECT" --context "$AUTH_CONTEXT" --evidence "$AUTH_EVIDENCE"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-browser-auth-verdict
          path: ${{ github.workspace }}/../qa-auth-evidence/safe-summary.json
