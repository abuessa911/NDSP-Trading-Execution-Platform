# Hosted Linux TEST-only override. Host networking enables a single loopback
# HTTPS issuer/callback origin. Original database/Redis/API health checks remain.
services:
  db:
    networks: !reset []
    network_mode: host
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
  redis:
    networks: !reset []
    network_mode: host
    command: ["sh", "-c", "exec redis-server --appendonly yes --bind 127.0.0.1 --requirepass \"$${REDIS_PASSWORD}\""]
  migrate:
    networks: !reset []
    network_mode: host
  bootstrap:
    networks: !reset []
    network_mode: host
  api:
    image: nex-m1-auth-test:isolated
    networks: !reset []
    network_mode: host
    command: ["python", "-m", "uvicorn", "nex_api.main:app", "--host", "127.0.0.1", "--port", "8000", "--no-access-log"]
    environment:
      ENVIRONMENT: test
      OIDC_BROWSER_LOGIN_ENABLED: "true"
      OIDC_CLIENT_ID: nex-m1-browser
      OIDC_REDIRECT_URI: https://localhost:18443/api/v1/auth/callback
      OIDC_POST_LOGOUT_REDIRECT_URI: https://localhost:18443/
      OIDC_POST_LOGIN_REDIRECT_URI: https://localhost:18443/
      NEX_SESSION_ENCRYPTION_KEY: ${NEX_SESSION_ENCRYPTION_KEY:?Synthetic test key required}
      SSL_CERT_FILE: /etc/nex-test/tls/cert.pem
      OIDC_ADMIN_MFA_POLICY: ${OIDC_ADMIN_MFA_POLICY}
      OIDC_ADMIN_MFA_CLIENT_ID: ${OIDC_ADMIN_MFA_CLIENT_ID}
      OIDC_ADMIN_MFA_CLIENT_SECRET: ${OIDC_ADMIN_MFA_CLIENT_SECRET}
      OIDC_ADMIN_MFA_MAX_AGE: ${OIDC_ADMIN_MFA_MAX_AGE}
      M2A_PUBLIC_MARKET_ENABLED: ${NEX_AUTH_M2A_PUBLIC_MARKET_ENABLED:-false}
    volumes:
      - ${NEX_AUTH_TEMP:?Explicit temporary directory}/tls:/etc/nex-test/tls:ro
  gateway:
    networks: !reset []
    network_mode: host
    ports: !reset []
    depends_on: !override {}
    volumes: !override
      - ./infra/testing/nginx.auth.conf:/etc/nginx/nginx.conf:ro
      - ${NEX_AUTH_TEMP}/tls:/etc/nex-test/tls:ro
      - ${NEX_AUTH_TEMP}/frontend:/usr/share/nginx/html:ro
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    network_mode: host
    command: ["start-dev", "--import-realm", "--http-port=9080", "--http-host=127.0.0.1"]
    environment:
      KC_HOSTNAME: https://localhost:18443/oidc
      KC_HTTP_RELATIVE_PATH: /oidc
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
    volumes:
      - ${NEX_AUTH_TEMP}/realm.json:/opt/keycloak/data/import/nex-test.json:ro