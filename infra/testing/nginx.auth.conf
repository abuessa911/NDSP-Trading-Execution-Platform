events {}
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  error_log /dev/stderr crit;
  server {
    listen 127.0.0.1:18443 ssl;
    server_name localhost;
    ssl_certificate /etc/nex-test/tls/cert.pem;
    ssl_certificate_key /etc/nex-test/tls/key.pem;
    add_header Referrer-Policy no-referrer always;
    location /oidc/ {
      proxy_pass http://127.0.0.1:9080;
      proxy_set_header Host localhost:18443;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host localhost:18443;
    }
    location /api/ { proxy_pass http://127.0.0.1:8000; }
    # Keep native administrative API probes out of static Next route handling.
    # This disposable test gateway is not production deployment authority.
    location /admin/v1/ { proxy_pass http://127.0.0.1:8000; }
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/index.html =404;
    }
  }
}