services:
  api:
    build: ./backend
    container_name: ndsp_trading_api
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: ndsp_trading_frontend
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules

  postgres:
    image: postgres:16
    container_name: ndsp_trading_postgres
    environment:
      POSTGRES_DB: tradingbot
      POSTGRES_USER: tradingbot
      POSTGRES_PASSWORD: tradingbot
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
